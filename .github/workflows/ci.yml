name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-gryps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders — never real secrets in CI logs
          NEON_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          MISTRAL_API_KEY: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
